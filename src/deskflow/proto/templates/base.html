<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tekforce{% endblock %}</title>
  <link rel="stylesheet" href="/proto/static/proto.css">
</head>
<body class="persona-{{ persona }} {% block body_class %}{% endblock %}">
  <p class="proto-bar">Tekforce prototype · fictional people and companies · not a live ATS</p>
  <header class="site-header">
    <a class="wordmark" href="/">Tekforce</a>
    <nav aria-label="Primary">
      {% for label, href in nav %}
      <a href="{{ href }}"{% if request.url.path == href %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="header-end">
      <a class="my-tekforce{% if request.url.path.startswith('/my-tekforce') %} is-current{% endif %}" href="{{ my_tekforce_href }}">My Tekforce</a>
      <form class="view-as" action="/view" method="post">
        <input type="hidden" name="next" value="{{ request.url.path }}">
        <label>
          <span>View as</span>
          <select name="as" onchange="this.form.submit()" aria-label="View as">
            {% for role in roles %}
            <option value="{{ role }}"{% if role == persona %} selected{% endif %}>{{ role|capitalize }}</option>
            {% endfor %}
          </select>
        </label>
      </form>
    </div>
  </header>

  {% if notice %}
  <p class="notice" role="status">{{ notice }}</p>
  {% endif %}

  <main>
    {% block main %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Tekforce LLC · sample walkthrough · desktop first, mobile later</p>
  </footer>
</body>
</html>
